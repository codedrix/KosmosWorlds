# The bridge's always-on front door (DB-044). The CEO deploys it: `npx wrangler deploy` from
# this folder, after `npx wrangler secret put BRIDGE_ORIGIN` and `npx wrangler secret put RELAY_SECRET`.
# No account id here: wrangler uses the signed-in account. Never put a secret in this file.
name = "kosmos-agent-bridge"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
WORLDS = "world://mission-control.micknerks"
