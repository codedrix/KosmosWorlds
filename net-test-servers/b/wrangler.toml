# kosmos-net-test-b -- Server B (never opted in) for the network device test, KOS-983.
# A test Worker on workers.dev, outside every production zone. CEO-delegated deploy
# (NETWORK_BUILD_PLAN lead addendum, 2026-10-10). Deploy: `npx wrangler deploy` from here.
name = "kosmos-net-test-b"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[durable_objects.bindings]]
name = "HIT_LOG"
class_name = "HitLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HitLog"]
